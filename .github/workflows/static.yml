# Deploy the static site to GitHub Pages, rebuilding PDF/PPTX from school-data.json
name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Thai fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-tlwg-sarabun fonts-noto-core

      - name: Install document-builder dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas openpyxl python-pptx reportlab pillow

      - name: Verify school data
        run: |
          test -f assets/data/school-data.json
          python -c "import json; d=json.load(open('assets/data/school-data.json')); assert d.get('national')"

      - name: Build PDF and PPTX
        run: python tools/build_docs.py --all --data assets/data/school-data.json --out dist

      - name: Verify generated documents
        run: |
          test -s dist/wsf-deck.pptx
          test -s dist/executive-brief.pdf
          test -s dist/one-pager.pdf
          ls -lh dist/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
